<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#182230;--muted:#697586;--line:#e2e7ef;--nav:#111827;--brand:#ef7d22;--brand2:#c95e0b;--green:#16845b;--greenbg:#e5f6ef;--red:#c43d4b;--redbg:#fff0f1;--amber:#936000;--amberbg:#fff4d5;--blue:#285ea8;--bluebg:#eaf2ff;--shadow:0 7px 25px #15243b0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5b17d;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--nav);color:#e7edf5;padding:20px 13px;display:flex;flex-direction:column;gap:20px}.brand{padding:0 9px 17px;border-bottom:1px solid #ffffff20;display:flex;gap:10px;align-items:center}.mark{background:var(--brand);color:#28180c;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-weight:900;font-size:17px}.brand-logo{width:48px;height:48px;object-fit:contain;flex:0 0 48px;border-radius:10px;background:#fff;padding:2px}.brand strong{font-size:17px}.brand strong span{color:#ffa563}.brand small{display:block;color:#aeb8c8;font-size:10px;letter-spacing:1px;text-transform:uppercase}.navlabel{font-size:10px;letter-spacing:1.4px;color:#8f9bae;padding:0 12px;text-transform:uppercase;font-weight:800}.nav{display:grid;gap:4px}.nav button{background:none;border:0;border-radius:9px;padding:11px 12px;color:#c2ccda;text-align:left;font-weight:650}.nav button:hover{background:#ffffff10}.nav button.active{background:#3a2b20;color:#ffb477}.sidetip{margin-top:auto;border:1px solid #ffffff20;padding:12px;border-radius:11px;color:#aeb8c8;font-size:11px}.main{min-width:0}.topbar{height:65px;position:sticky;top:0;z-index:4;background:#ffffffeb;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.crumb{color:var(--muted);font-size:12px}.demo{border-radius:99px;background:var(--amberbg);color:var(--amber);font-size:10px;font-weight:850;padding:6px 10px}.content{max-width:1500px;margin:auto;padding:26px 28px 48px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:21px}.eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--brand2);font-weight:850;text-transform:uppercase;margin-bottom:5px}.head h1{font-size:27px;letter-spacing:-.7px;line-height:1.2;margin:0}.head p{margin:6px 0 0;color:var(--muted);max-width:780px}.actions,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:700}.btn:hover{border-color:#c1cad7}.btn.primary{background:var(--brand);border-color:var(--brand);color:#24170c}.btn.dark{background:var(--nav);border-color:var(--nav);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.btn.red{color:var(--red);border-color:#efc2c7}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:16px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}.stat:hover{border-color:#f0a66d;transform:translateY(-1px)}.stat .label{color:var(--muted);font-size:11px;font-weight:800}.stat strong{display:block;font-size:28px;letter-spacing:-.8px;margin:7px 0}.stat small{color:var(--muted);font-size:11px}.stat.orange strong{color:var(--brand2)}.stat.blue strong{color:var(--blue)}.stat.green strong{color:var(--green)}.card{padding:17px;min-width:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.cardhead h2{font-size:15px;margin:0}.muted{color:var(--muted)}.tiny{font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf0f5;color:#566273;font-size:10px;font-weight:800;white-space:nowrap}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.blue{background:var(--bluebg);color:var(--blue)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:white}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;text-transform:uppercase;letter-spacing:.7px;font-size:10px;color:#7a8594;background:#f8f9fb;padding:12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf0f4;vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfcfd}.tdmain{font-weight:750}.tdsub{font-size:11px;color:var(--muted);margin-top:2px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:11px;font-weight:800;color:#566273}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;min-width:0;padding:9px 10px;border:1px solid #dce2ea;border-radius:9px;background:#fff;color:var(--ink)}.toolbar input{width:min(310px,100%)}.empty{text-align:center;padding:28px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.list{display:grid;gap:9px}.purchase{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.purchase:hover{border-color:#efb17f}.purchase .right{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.purchase small{display:block;color:var(--muted);margin-top:4px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:white;color:#556172;font-weight:750}.tabs button.active{background:var(--nav);border-color:var(--nav);color:#fff}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.stage{background:#eff2f6;border:1px solid #e3e8ef;border-radius:12px;padding:11px;min-height:140px}.stage h3{font-size:12px;margin:0 0 10px;display:flex;justify-content:space-between}.itemcard{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;margin-bottom:8px}.itemcard:last-child{margin-bottom:0}.itemcard b{display:block}.itemcard small{display:block;color:var(--muted);margin:4px 0 8px}.offer{border:1px solid var(--line);padding:9px;border-radius:9px;margin-top:7px}.offer.selected{border-color:#8ed5b6;background:#f4fff9}.offerline{display:flex;justify-content:space-between;gap:8px}.alert{padding:11px 13px;border-radius:9px;margin-bottom:13px;font-size:12px}.alert.warn{background:var(--amberbg);color:#795300;border:1px solid #f0dfa9}.alert.info{background:var(--bluebg);color:#28518a;border:1px solid #d3e2fb}.alert.red{background:var(--redbg);color:#a12c3a;border:1px solid #f3c7cd}.alert.good{background:var(--greenbg);color:#176e4e;border:1px solid #c3e9d8}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#10182799;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.open{display:flex}.modal{background:white;border-radius:16px;width:min(700px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 90px #0003}.modalhead,.modalfoot{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.modalhead h2{margin:0;font-size:18px}.modalbody{padding:20px}.modalfoot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end}.toast{position:fixed;bottom:20px;right:20px;z-index:30;background:#152033;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.settingrow{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.settingrow:last-child{border:0}.settingrow small{display:block;color:var(--muted);margin-top:3px}.unitchoices{display:flex;gap:7px;flex-wrap:wrap}.unitchoices button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:750}.unitchoices button.active{background:var(--brand);border-color:var(--brand);color:#25170c}.footnote{text-align:center;color:#8993a2;font-size:11px;margin-top:22px}
@media(max-width:1000px){.app{grid-template-columns:190px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.side{padding:10px;position:sticky;top:0;z-index:10}.brand{border:0;padding:0 4px 8px}.mark{width:34px;height:34px}.brand strong{font-size:15px}.navlabel,.sidetip{display:none}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.topbar{height:48px;padding:0 14px}.content{padding:18px 13px 36px}.head h1{font-size:23px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.purchase{align-items:flex-start;flex-direction:column}.purchase .right{justify-content:flex-start}.actions{width:100%}.actions .btn{flex:1}.demo{font-size:9px}.card{padding:13px}}

.cat-c4{background:#ffe7ed;color:#a61b45;border-color:#ffc5d2}.cat-c5{background:#e0f7fa;color:#006874;border-color:#b5eaf0}

let state=load(),page='dashboard',currentId='',purchaseTab='open',search='',categoryFilter='Todos',reportPeriod='month',reportMonth=today().slice(0,7),dashboardMonth='2026-10',modalMode='',modalData=null,unitChoice='KG';

function statusForPurchase(p){if(p.items.length&&p.items.every(i=>i.status==='delivered'||i.status==='closed'))return 'Finalizado';if(p.items.some(i=>i.status==='in_transit'))return 'Em rota';if(p.items.some(i=>i.status==='ordered'||i.status==='delivered'||i.status==='closed'))return 'Pedido realizado';if(p.items.some(i=>i.status==='selection'))return 'Aguardando confirmação';return 'Em cotação'}
function itemTotal(i){const o=(i.offers||[]).find(o=>o.supplierId===i.selectedSupplierId);return o?Number(o.price)*Number(i.qty):0}
function purchaseTotal(p){return p.items.reduce((s,i)=>s+itemTotal(i),0)}
function stats(label,value,sub,filter,kind=''){return `<button class="stat ${kind}" data-action="dashboardFilter" data-filter="${filter}"><span class="label">${label}</span><strong>${value}</strong><small>${sub} → Clique para abrir</small></button>`}


const SEEDQ={sim_s1:[94,4.4,3],sim_s2:[98,4.8,1],sim_s3:[90,4.2,5],sim_s4:[96,4.6,2],sim_s5:[82,4,8]};
function rkd(s){const d=SEEDQ[s.id]||[90,4,4];return{e:s.e??d[0],q:s.q??d[1],r:s.r??d[2],n:s.n??5}}
function rk(s){const d=rkd(s);return Math.round(d.e*.4+d.q/5*100*.35+Math.max(0,100-d.r*6)*.25)}
const rankList=()=>[...state.suppliers].filter(s=>s.active!==false).sort((a,b)=>rk(b)-rk(a));
const rpos=s=>rankList().findIndex(x=>x.id===s.id)+1;
function offerCell(i,o){const pr=x=>Number(x.price??x.unitPrice),min=i.offers.reduce((a,b)=>pr(b)<pr(a)?b:a),s=supplier(o.supplierId);
 const al=pr(o)>pr(min)?`<div class="tiny" style="color:#b45309;font-weight:600">⚠ Preço ${((pr(o)/pr(min)-1)*100).toFixed(1).replace('.',',')}% acima de ${esc(supplier(min.supplierId).name)} (+${money((pr(o)-pr(min))*Number(i.qty))})</div>`:'';
 return `<b>#${rpos(s)}</b> ${esc(s.name)} ${pill('Nota '+rk(s),'blue')} ${pr(o)===pr(min)?pill('MENOR PREÇO','green'):''}${al}${o.supplierId===i.selectedSupplierId&&i.justification?`<div class="tiny" style="color:#1d4ed8">Motivo da escolha: ${esc(i.justification.reason)}${i.justification.note?' ('+esc(i.justification.note)+')':''}</div>`:''}`}

const byName=(a,b)=>a.name.localeCompare(b.name,'pt-BR');
const REASONS=['Urgência na entrega','Melhor ranking (entrega, qualidade e resposta)','Condição de pagamento melhor','Pedido mínimo ou frete','Único fornecedor com o produto disponível','Outro motivo'];
const pr_=o=>Number(o.price??o.unitPrice),offOf=(i,sid)=>(i.offers||[]).find(o=>o.supplierId===sid),cheapest=i=>i.offers.reduce((a,b)=>pr_(b)<pr_(a)?b:a);
const dl=o=>Number(o.deliveryDays??o.days??99);
function sugWhy(i,o){const m=cheapest(i);if(i.urgent||dl(o)<dl(m))return REASONS[0];if(rk(supplier(o.supplierId))>rk(supplier(m.supplierId)))return REASONS[1];return REASONS[5]}
function pickSup(i,sid){const o=offOf(i,sid);i.selectedSupplierId=sid;i.selectedOfferId=o.id;if(pr_(o)>pr_(cheapest(i))){if(!i.justification||i.justification.sup!==sid)i.justification={sup:sid,reason:sugWhy(i,o),note:''}}else delete i.justification}
function warnText(i){const o=offOf(i,i.selectedSupplierId),m=cheapest(i);return `Seu insumo ${esc(product(i.productId).name)} está ${money((pr_(o)-pr_(m))*Number(i.qty))} (${((pr_(o)/pr_(m)-1)*100).toFixed(1).replace('.',',')}%) mais caro em ${esc(supplier(o.supplierId).name)} do que em ${esc(supplier(m.supplierId).name)}.`}
const costly=i=>i.offers?.length>1&&offOf(i,i.selectedSupplierId)&&pr_(offOf(i,i.selectedSupplierId))>pr_(cheapest(i));
const whyHtml=i=>`<div class="alert warn" style="margin:8px 0">⚠ ${warnText(i)}</div><label style="font-size:13px"><b>Por que comprar neste fornecedor? *</b></label><select data-chg="why" data-item="${i.id}" style="width:100%;margin:4px 0">${REASONS.map(r=>`<option ${i.justification?.reason===r?'selected':''}>${r}</option>`).join('')}</select><input data-chg="note" data-item="${i.id}" placeholder="Detalhe (opcional)" value="${esc(i.justification?.note||'')}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px">`;
function apdlg(p){
 const its=p.items.filter(i=>i.status==='selection'&&(i.offers||[]).length);
 if(!its.length){toast('Nenhum insumo com proposta pronto para aprovar.');return}
 const g={};its.forEach(i=>(g[i.selectedSupplierId]=g[i.selectedSupplierId]||[]).push(i));
 openD('Confirmar envio · '+esc(p.code),`<p class="muted tiny">Revise o fornecedor de cada insumo. Você pode trocar. Se escolher um fornecedor mais caro, o motivo fica registrado.</p>
 ${its.map(i=>{const pr=product(i.productId),m=cheapest(i);return `<div class="card" style="padding:12px;margin:10px 0"><b>${esc(pr.name)}</b> · ${i.qty} ${esc(pr.unit)} ${i.urgent?pill('URGENTE','red'):''}<select data-chg="sup" data-item="${i.id}" style="width:100%;margin:6px 0;padding:8px">${[...i.offers].sort((a,b)=>rk(supplier(b.supplierId))-rk(supplier(a.supplierId))).map(o=>`<option value="${o.supplierId}" ${o.supplierId===i.selectedSupplierId?'selected':''}>#${rpos(supplier(o.supplierId))} ${esc(supplier(o.supplierId).name)} · nota ${rk(supplier(o.supplierId))} · ${money(pr_(o))}/${esc(pr.unit)} · ${dl(o)} dia(s)${o===m?' · MENOR PREÇO':''}</option>`).join('')}</select><b>${money(itemTotal(i))}</b>${costly(i)?whyHtml(i):''}</div>`}).join('')}
 <div class="card" style="padding:12px"><b>Resumo do envio por fornecedor</b>${Object.entries(g).map(([sid,l])=>`<div class="settingrow"><span><b>${esc(supplier(sid).name)}</b><br><small class="muted">${l.map(i=>i.qty+' '+esc(product(i.productId).unit)+' '+esc(product(i.productId).name)).join(' · ')}</small></span><b>${money(l.reduce((a,i)=>a+itemTotal(i),0))}</b></div>`).join('')}</div>
 <div style="margin-top:12px">${btn('Confirmar e enviar aos fornecedores','confirmSend','primary',`data-id="${p.id}"`)}</div>`)}
function sendDlg(p){
 const g={};p.items.filter(i=>i.status==='ordered'&&i.selectedSupplierId).forEach(i=>(g[i.selectedSupplierId]=g[i.selectedSupplierId]||[]).push(i));
 openD('Pedido aprovado · enviar aos fornecedores',`<div class="alert good">Cotação ${esc(p.code)} aprovada. Cada fornecedor recebe somente os insumos aprovados para ele, com as quantidades.</div>${Object.entries(g).map(([sid,l])=>{const s=supplier(sid),msg=`Olá, ${s.name}! Pedido da ${state.company.name} (cotação ${p.code}):\n${l.map(i=>`• ${i.qty} ${product(i.productId).unit} de ${product(i.productId).name} a ${money(pr_(offOf(i,sid)))}`).join('\n')}\nTotal: ${money(l.reduce((a,i)=>a+itemTotal(i),0))}. Confirme o recebimento e a data de entrega. Obrigado!`;return `<div class="card" style="padding:12px;margin:10px 0"><b>${esc(s.name)}</b><textarea id="o_${s.id}" readonly style="width:100%;min-height:110px;margin:8px 0">${esc(msg)}</textarea><div style="display:flex;gap:6px;flex-wrap:wrap">${btn('Abrir WhatsApp','openSupplierWA','small primary',`data-url="https://wa.me/${esc(s.phone)}?text=${encodeURIComponent(msg)}"`)}${btn('Copiar mensagem','copySupplierMessage','small',`data-message-id="o_${s.id}"`)}</div></div>`}).join('')}<div style="margin-top:10px">${btn('PDF de requisição para o recebedor','reqPdf','',`data-id="${p.id}"`)}</div>`)}
function stockHtml(group){
 const logo=document.querySelector('.brand-logo')?.src||'',cats=[...new Set(state.products.map(x=>x.category))].filter(c=>group==='Todos'||c===group).sort((a,b)=>a.localeCompare(b,'pt-BR'));
 return `<!doctype html><meta charset="utf-8"><style>body{font:13px system-ui,sans-serif;margin:0;padding:24px;color:#111}.hd{display:flex;gap:12px;align-items:center;border:2px solid #111;border-radius:10px;padding:10px;margin-bottom:10px}.hd img{width:54px;height:54px;border-radius:8px;object-fit:contain;background:#111}table{width:100%;border-collapse:collapse;margin:6px 0 16px;page-break-inside:auto}th,td{border:1px solid #888;padding:7px 8px;text-align:left}th{background:#e8eaee}h3{margin:14px 0 0;background:#ef7d22;color:#fff;padding:5px 10px;border-radius:6px 6px 0 0}td.b{width:90px}</style>
 <div class="hd"><img src="${logo}"><div><b style="font-size:17px">CotaBot</b> by SaborGestão<br><b>Conferência de estoque</b> · ${esc(state.company.name)}</div><div style="margin-left:auto;text-align:right">${dateBR(today())}<br>Conferido por: ____________</div></div>
 <p>Confira o estoque e preencha <b>"Comprar"</b> só nos itens necessários. Depois lance as quantidades na cotação.</p>
 ${cats.map(c=>`<h3>${esc(c)}</h3><table><thead><tr><th>Insumo</th><th>Unid.</th><th class="b">Estoque atual</th><th class="b">Comprar</th></tr></thead><tbody>${state.products.filter(x=>x.category===c).sort(byName).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td></td><td></td></tr>`).join('')}</tbody></table>`).join('')}`}
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const {p,i}=findItem(el.dataset.item);if(!i)return;const k=el.dataset.chg;

function dashboard(){
 const month=dashboardMonth||'2026-10';
 const monthItems=allItems().filter(x=>x.purchase.created.slice(0,7)===month);
 const ordered=monthItems.filter(x=>['selection','ordered','in_transit','delivered','closed'].includes(x.status));
 const spent=ordered.reduce((sum,x)=>sum+itemTotal(x),0);
 const savings=ordered.reduce((sum,x)=>{
  const offers=(x.offers||[]).filter(o=>Number(o.price??o.unitPrice)>=0);
  if(offers.length<2)return sum;
  const prices=offers.map(o=>Number(o.price??o.unitPrice)).sort((a,b)=>a-b);
  const selected=offers.find(o=>o.supplierId===x.selectedSupplierId);
  const selectedPrice=Number(selected?.price??selected?.unitPrice??prices[0]);
  return sum+Math.max(0,prices[prices.length-1]-selectedPrice)*Number(x.qty);
 },0);
 const openQuotes=state.purchases.filter(p=>p.created.slice(0,7)===month&&p.items.some(i=>i.status==='quoting')).length;

 const recent=[...state.purchases].filter(p=>p.created.slice(0,7)===month).sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5);

 ordered.forEach(x=>{const day=x.purchase.created.slice(8,10);spendByDay[day]=(spendByDay[day]||0)+itemTotal(x)});

 ${bars.length?`<div style="display:flex;align-items:flex-end;gap:8px;height:190px;padding:16px 4px 0;border-bottom:1px solid var(--line)">${bars.map(([day,val])=>`<div title="${day}/${month.slice(5,7)}: ${money(val)}" style="flex:1;min-width:14px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px"><div style="width:100%;max-width:42px;height:${Math.max(4,val/maxBar*145)}px;background:#f58220;border-radius:5px 5px 0 0"></div><small>${day}</small></div>`).join('')}</div>`:empty('Sem compras neste mês','Os valores aparecerão quando houver pedidos registrados.')}

function openModal(title,body,mode,data=null,submit='Salvar'){modalMode=mode;modalData=data;$('#modalTitle').textContent=title;$('#modalbody').innerHTML=body;$('#modalSubmit').textContent=submit;$('#modalback').classList.add('open')}
function closeModal(){$('#modalback').classList.remove('open')}
function unitField(value='KG'){return `<div class="field full"><label>Unidade de compra *</label><div class="unitchoices">${['KG','UND','CX'].map(u=>`<button type="button" data-action="pickUnit" data-unit="${u}" class="${value===u?'active':''}">${u}</button>`).join('')}<button type="button" data-action="pickUnit" data-unit="custom" class="${!['KG','UND','CX'].includes(value)?'active':''}">＋ Nova unidade</button></div><input id="pUnit" value="${esc(value)}" placeholder="Ex.: KG, UND, CX ou pacote 12 un" style="margin-top:7px" required></div>`}
function newSupplier(id=null){
 const s=id?state.suppliers.find(x=>x.id===id):null;const cats=s?.categories||[];
 openModal(s?'Editar fornecedor':'Novo fornecedor',`<div class="formgrid">
 <div class="field"><label>Nome do fornecedor *</label><input id="fName" required value="${esc(s?.name||'')}"></div><div class="field"><label>WhatsApp com DDI</label><input id="fPhone" value="${esc(s?.phone||'')}" placeholder="5561999999999"></div>
 <div class="field full"><label>Categorias atendidas * (selecione todas)</label><div class="formgrid">${CATS.map(c=>`<label style="display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px"><input type="checkbox" name="fCats" value="${esc(c)}" ${cats.includes(c)?'checked':''}>${esc(c)}</label>`).join('')}</div></div>
 <div class="field"><label>Cidade</label><input id="fCity" value="${esc(s?.city||'')}"></div><div class="field"><label>Tempo de entrega (dias)</label><input id="fDays" type="number" min="0" value="${s?.days??1}"></div>
 <div class="field"><label>Pedido mínimo (R$)</label><input id="fMin" type="number" min="0" step=".01" value="${s?.min??0}"></div><div class="field"><label>Frete / taxa (R$)</label><input id="fFee" type="number" min="0" step=".01" value="${s?.fee??0}"></div>
 <div class="field"><label>Prazo de pagamento *</label><select id="fPayment">${PAYMENTS.map(v=>`<option ${v===(s?.payment||'À vista')?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field" id="otherPaymentWrap" style="${s?.payment==='Outros'?'':'display:none'}"><label>Especifique a condição</label><input id="fPaymentOther" value="${esc(s?.paymentOther||'')}" placeholder="Ex.: 30/45 dias"></div>
 <div class="field full"><label><input id="fActive" type="checkbox" ${s?.active!==false?'checked':''}> Fornecedor ativo</label></div></div>`,'supplier',{id},'Salvar fornecedor');
}
function newProduct(id=null){
 const p=id?state.products.find(x=>x.id===id):null;const u=p?.unit||'KG';
 openModal(p?'Editar insumo':'Novo insumo',`<div class="formgrid"><div class="field"><label>Nome do insumo *</label><input id="pName" required value="${esc(p?.name||'')}"></div><div class="field"><label>Categoria *</label><select id="pCategory" required>${CATS.map(c=>`<option ${c===(p?.category||'Proteínas')?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${unitField(u)}<div class="field"><label>Último preço unitário (R$)</label><input id="pPrice" type="number" min="0" step=".01" value="${p?.lastPrice??''}"></div></div>${p?`<div style="margin-top:14px">${btn('Excluir insumo','deleteProduct','small red')}</div>`:''}`,'product',{id},'Salvar insumo');
}
function newPurchase(){
 const groups=[...new Set(state.products.map(p=>p.category))];
 openModal('Nova cotação',`<div class="formgrid"><div class="field"><label>Grupo de produtos</label><select id="buyGroup"><option value="Todos">Todos os grupos</option>${groups.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Data limite para cotação *</label><input id="buyDeadline" type="date" value="${esc(state.company.deadline||today())}" required><label style="margin-top:8px">Horário de encerramento *</label><input id="buyDeadlineTime" type="time" value="17:00" required></div><div class="field full"><label>Observação / instrução ao fornecedor</label><input id="buyNote" placeholder="Ex.: entregar até 10h, produtos refrigerados"></div></div><div class="cardhead" style="margin-top:17px"><h2>Selecione os itens e quantidades</h2>${btn('🖨 Imprimir lista para conferência de estoque','printStock','small')}</div><div id="buyProducts">${buyProductRows('Todos')}</div>`,'purchase',null,'Criar cotação');
}
function bulkQuote(){
 if(!state.products.length)return toast('Cadastre ou importe os insumos antes de iniciar uma cotação.');
 if(!state.suppliers.some(s=>s.active!==false))return toast('Cadastre ou importe fornecedores antes de enviar cotações.');
 const groups=[...new Set(state.products.map(p=>p.category))];
 const productRows=[...state.products].sort(byName).map(p=>`<label class="settingrow" style="cursor:pointer;gap:12px"><input type="checkbox" data-bulkproduct="${p.id}" style="width:18px;height:18px"><div style="flex:1"><b>${esc(p.name)}</b><small>${esc(p.category)} · ${esc(p.unit)}</small></div><input data-bulkqty="${p.id}" type="number" min="0" step=".01" value="1" style="width:90px;padding:8px;border:1px solid var(--line);border-radius:8px" aria-label="Quantidade de ${esc(p.name)}"></label>`).join('');
 openModal('Solicitar cotação',`<p class="muted">Selecione os insumos e os fornecedores que devem receber a solicitação. O sistema preparará uma mensagem individual para cada fornecedor elegível.</p>
 <div class="formgrid"><div class="field"><label>Grupo de insumos</label><select id="bulkGroup"><option value="Todos">Todos os grupos</option>${groups.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
 <div class="field"><label>Data limite *</label><input id="bulkDeadline" type="date" value="${esc(state.company.deadline||today())}" required></div>
 <div class="field"><label>Horário de encerramento *</label><input id="bulkDeadlineTime" type="time" value="17:00" required></div>
 <div class="field"><label>Condição de pagamento</label><select id="bulkPayment"><option value="Manter condição cadastrada">Manter condição cadastrada</option>${PAYMENTS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div>
 <div class="cardhead" style="margin-top:16px"><h2>Fornecedores destinatários</h2><button type="button" class="btn small" data-action="selectEligibleSuppliers">Selecionar elegíveis</button></div>
 <div id="bulkSuppliers" class="supplier-checks">${state.suppliers.filter(s=>s.active!==false).map(s=>`<label class="settingrow"><input type="checkbox" data-bulksupplier="${s.id}" style="width:18px;height:18px"><div style="flex:1"><b>${esc(s.name)}</b><small>${esc(s.categories.join(', '))} · ${esc(s.phone||'Sem telefone cadastrado')}</small></div></label>`).join('')}</div>
 <div class="cardhead" style="margin-top:16px"><h2>Insumos para cotar</h2>${btn('🖨 Imprimir para conferência de estoque','printStock','small')}</div><div style="max-height:260px;overflow:auto">${productRows}</div>
 <div class="field" style="margin-top:12px"><label>Observação ao fornecedor</label><textarea id="bulkNote" placeholder="Ex.: informar marca, validade e prazo de entrega"></textarea></div>`,'bulkQuote',null,'Preparar envio via WhatsApp');
}
function buyProductRows(group){return [...state.products].sort(byName).filter(p=>group==='Todos'||p.category===group).map(p=>`<div class="settingrow"><div><b>${esc(p.name)}</b><small>${esc(p.category)} · ${esc(p.unit)}</small></div><input data-buyqty="${p.id}" type="number" min="0" step=".01" value="0" style="width:115px;padding:8px;border:1px solid var(--line);border-radius:8px" aria-label="Quantidade de ${esc(p.name)}"></div>`).join('')||empty('Nenhum insumo neste grupo','Cadastre produtos ou escolha outro grupo.') }
function addOffer(itemId){const p=purchase(),i=p?.items.find(x=>x.id===itemId)||p?.items.find(x=>x.status==='quoting');if(!i)return toast('Nenhum item aguardando proposta.');const pr=product(i.productId),ss=activeSuppliersFor(pr);openModal('Registrar proposta',`<div class="alert info">${esc(pr.name)} · ${i.qty} ${esc(pr.unit)}. Fornecedores elegíveis pela categoria: ${ss.length}.</div><div class="formgrid"><div class="field full"><label>Fornecedor *</label><select id="oSupplier" required>${ss.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.payment)}</option>`).join('')}</select></div><div class="field"><label>Preço unitário (R$) *</label><input id="oPrice" type="number" min=".01" step=".01" required></div><div class="field"><label>Prazo de entrega (dias)</label><input id="oDays" type="number" min="0" value="${ss[0]?.days||1}"></div><div class="field full"><label>Condição de pagamento proposta</label><select id="oPayment">${PAYMENTS.map(v=>`<option ${v===(ss[0]?.payment||'À vista')?'selected':''}>${esc(v)}</option>`).join('')}</select></div></div>${ss.length?'':'<div class="alert warn">Nenhum fornecedor ativo atende à categoria. Cadastre um fornecedor ou atualize as categorias.</div>'}`,'offer',{itemId:i.id},'Registrar proposta')}
function newChange(itemId){const {p,i}=findItem(itemId);if(!i)return;openModal('Registrar alteração informada pelo fornecedor',`<div class="alert warn">Pedido confirmado: ${esc(product(i.productId).name)} · quantidade ${i.qty} ${esc(product(i.productId).unit)} · total ${money(itemTotal(i))}. A alteração ficará pendente até aprovação.</div><div class="formgrid"><div class="field"><label>Campo alterado</label><select id="chField"><option value="Quantidade">Quantidade</option><option value="Preço unitário">Preço unitário</option><option value="Prazo de entrega">Prazo de entrega</option><option value="Condição de pagamento">Condição de pagamento</option></select></div><div class="field"><label>Novo valor informado</label><input id="chValue" required placeholder="Informe o novo valor"></div><div class="field full"><label>Motivo / mensagem recebida</label><textarea id="chNote" placeholder="Opcional"></textarea></div></div>`,'change',{itemId},'Registrar alerta')}
function findItem(itemId){const p=purchase();return {p,i:p?.items.find(i=>i.id===itemId)}}
function exportCSV(){const rows=[['Compra','Data','Item','Categoria','Quantidade','Unidade','Status','Fornecedor','Preço unitário','Valor total','Pagamento']];state.purchases.forEach(p=>p.items.forEach(i=>{const o=(i.offers||[]).find(o=>o.supplierId===i.selectedSupplierId);rows.push([p.code,p.created,product(i.productId).name,product(i.productId).category,i.qty,product(i.productId).unit,statusLabel(i.status),supplier(i.selectedSupplierId).name,o?.price??'',itemTotal(i),o?.payment||supplier(i.selectedSupplierId).payment])}));download('cotabot-relatorio.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n'))}
function download(name,type,data){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function eventAction(el){
 const a=el.dataset.action,id=el.dataset.id;
 if(a==='closeModal'){closeModal();return}
 if(cbx(a,el))return;
 if(a==='newPurchase'){newPurchase();return}
 if(a==='bulkQuote'){bulkQuote();return}
 if(a==='selectEligibleSuppliers'){const chosen=$$('[data-bulkproduct]:checked').map(x=>product(x.dataset.bulkproduct));if(!chosen.length){toast('Selecione os insumos primeiro.');return}const cats=[...new Set(chosen.map(p=>p.category))];$$('[data-bulksupplier]').forEach(x=>{const s=supplier(x.dataset.bulksupplier);x.checked=s.categories.some(c=>cats.includes(c))});return}
 if(a==='openSupplierWA'){const url=el.dataset.url;if(url)window.open(url,'_blank','noopener');return}
 if(a==='copySupplierMessage'){const t=$('#'+(el.dataset.messageId||'supplierMessage0'))?.value||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('Mensagem copiada.')).catch(()=>showText(t));else showText(t);return}
 if(a==='newSupplier'){newSupplier();return}
 if(a==='newProduct'){newProduct();return}
 if(a==='editSupplier'){newSupplier(id);return}
 if(a==='editProduct'){newProduct(id);return}
 if(a==='goPurchases'){page='purchases';search='';render();return}
 if(a==='goSuppliers'){page='suppliers';search='';render();return}
 if(a==='goProducts'){page='products';search='';render();return}
 if(a==='goReports'){page='dashboard';render();return}
 if(a==='openPurchase'){currentId=id;page='detail';render();return}
 if(a==='dashboardFilter'){page='purchases';const f=el.dataset.filter;purchaseTab=f==='open'||f==='quoting'||f==='selection'?'open':f==='route'||f==='orders'?'orders':'all';render();if(f==='quoting'||f==='selection'){toast('Lista de compras aberta. Veja o status de cada item.')}return}
 if(a==='purchaseTab'){purchaseTab=el.dataset.tab;render();return}
 if(a==='addOffer'){addOffer(el.dataset.item);return}
 if(a==='chooseOffer'){const {p,i}=findItem(el.dataset.item);if(!i)return;i.selectedSupplierId=el.dataset.supplier;event(p,`Proposta de ${supplier(el.dataset.supplier).name} selecionada para ${product(i.productId).name}.`);save();render();return}
 if(a==='orderItem'){const {p,i}=findItem(el.dataset.item);if(!i||!i.selectedSupplierId)return toast('Selecione uma proposta antes de confirmar.');if(i.status!=='selection')return;i.status='ordered';i.deliveryStatus='awaiting';const o=i.offers.find(o=>o.supplierId===i.selectedSupplierId);event(p,`Pedido confirmado: ${product(i.productId).name} com ${supplier(i.selectedSupplierId).name}, ${money(o.price*i.qty)}. Pagamento: ${o.payment||supplier(i.selectedSupplierId).payment}.`);p.paymentSummary=[...new Set(p.items.filter(x=>x.selectedSupplierId).map(x=>(x.offers.find(o=>o.supplierId===x.selectedSupplierId)||{}).payment||supplier(x.selectedSupplierId).payment))].join(' / ');save();render();toast('Pedido confirmado.');return}
 if(a==='setStatus'){const {p,i}=findItem(el.dataset.item);if(!i)return;i.status=el.dataset.status;event(p,`${product(i.productId).name}: status atualizado para ${statusLabel(i.status)}.`);if(i.status==='delivered')i.deliveryStatus='delivered';save();render();toast('Status atualizado.');return}
 if(a==='newChange'){newChange(el.dataset.item);return}
 if(a==='resolveChange'){const {p,i}=findItem(el.dataset.item);const c=i?.changes?.find(c=>c.id===el.dataset.change);if(!c)return;if(el.dataset.result==='accepted'){c.status='accepted';if(c.field==='Quantidade')i.qty=Number(c.newValue)||i.qty;else if(c.field==='Preço unitário'){const o=i.offers.find(o=>o.supplierId===i.selectedSupplierId);if(o)o.price=Number(c.newValue)||o.price}else if(c.field==='Prazo de entrega')p.expectedDelivery=c.newValue;else if(c.field==='Condição de pagamento'){const o=i.offers.find(o=>o.supplierId===i.selectedSupplierId);if(o)o.payment=c.newValue}}else c.status='rejected';event(p,`Alteração de ${c.field} ${c.status==='accepted'?'aceita':'rejeitada'} para ${product(i.productId).name}.`);save();render();toast('Análise da alteração registrada.');return}
 if(a==='saveSettings'){state.company.name=$('#companyName').value.trim()||'Minha empresa';state.company.whatsapp=$('#companyWhats').value.trim();state.company.deadline=$('#companyDeadline').value||today();save();render();toast('Configurações salvas.');return}
 if(a==='exportCSV'){exportCSV();toast('CSV exportado.');return}
 if(a==='exportJSON'){download('cotabot-backup.json','application/json',JSON.stringify(state,null,2));toast('Backup baixado.');return}
 if(a==='resetDemo'){if(confirm('Apagar todos os fornecedores, insumos e pedidos deste navegador? Esta ação não pode ser desfeita.')){state=buildSimulatedHistory();save();page='dashboard';currentId='';render();toast('Simulações restauradas.')}return}
 if(a==='deleteProduct'){if(!confirm('Excluir este insumo?'))return;state.products=state.products.filter(p=>p.id!==modalData.id);save();closeModal();render();toast('Insumo excluído.');return}
 if(a==='deleteSupplier'){if(!confirm('Excluir este fornecedor?'))return;state.suppliers=state.suppliers.filter(s=>s.id!==modalData.id);save();closeModal();render();toast('Fornecedor excluído.');return}
 if(a==='pickUnit'){const u=el.dataset.unit;const inp=$('#pUnit');$$('.unitchoices button').forEach(b=>b.classList.toggle('active',b.dataset.unit===u));if(u==='custom'){inp.value='';inp.placeholder='Digite a nova unidade';inp.focus()}else{inp.value=u;inp.placeholder='Ex.: KG, UND, CX ou pacote 12 un'}return}
 if(a==='importExcel'){const f=$('#excelFile');f?.click();return}
 if(a==='validateImport'){validateImport();return}
 if(a==='cancelImport'){window.pendingImport=null;$('#importPreview').innerHTML='';toast('Importação cancelada.');return}
 if(a==='confirmImport'){
  const data=window.pendingImport;if(!data)return toast('Valide a planilha antes de confirmar.');
  let addedS=0,updatedS=0,addedP=0,updatedP=0;
  data.suppliers.forEach(x=>{const existing=state.suppliers.find(s=>s.name.trim().toLowerCase()===x.name.toLowerCase());const cats=x.categories.map(c=>CATS.find(v=>normKey(v)===normKey(c))||c);const record={...x,categories:cats};if(existing){Object.assign(existing,record);updatedS++}else{state.suppliers.push({id:uid(),...record});addedS++}});
  data.products.forEach(x=>{const existing=state.products.find(p=>p.name.trim().toLowerCase()===x.name.toLowerCase());const cat=CATS.find(v=>normKey(v)===normKey(x.category))||x.category;const record={...x,category:cat};if(existing){Object.assign(existing,record);updatedP++}else{state.products.push({id:uid(),...record});addedP++}});
  save();window.pendingImport=null;$('#importPreview').innerHTML=`<div class="alert good">Importação concluída. Fornecedores: ${addedS} novos e ${updatedS} atualizados. Produtos: ${addedP} novos e ${updatedP} atualizados.</div>`;toast('Cadastros importados.');return
 }
 if(a==='openBulkWA'){const url=el.dataset.url;if(url)window.open(url,'_blank','noopener');return}
 if(a==='copyBulkWA'){const txt=$('#waText')?.value||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Mensagem copiada.')).catch(()=>showText(txt));else showText(txt);return}
 if(a==='saveItemSettings'){
  const p=purchase(); const item=p?.items.find(x=>x.id===el.dataset.id);
  if(!p||!item)return;
  const qty=Number(document.querySelector(`[data-itemqty="${item.id}"]`)?.value);
  if(!Number.isFinite(qty)||qty<=0){toast('Informe uma quantidade maior que zero.');return}
  item.qty=qty;
  item.deliveryDate=document.querySelector(`[data-itemdelivery="${item.id}"]`)?.value||'';
  item.urgent=!!document.querySelector(`[data-itemurgent="${item.id}"]`)?.checked;
  event(p,`Item ${product(item.productId).name} atualizado: quantidade ${qty}, prazo ${item.deliveryDate||'a confirmar'}${item.urgent?', marcado como urgente':''}.`);
  save();render();toast('Quantidade, prazo e urgência salvos.');return
}
if(a==='sendWA'){const p=purchase();if(!p)return;const text=`Olá! Tudo bem? 🤝\nAqui é da ${state.company.name}.\nSolicitação de cotação ${p.code}:\n${p.items.map(i=>`• ${i.qty} ${product(i.productId).unit} de ${product(i.productId).name}`).join('\n')}\nPrazo: ${dateBR(p.deadline)}.\nObrigado(a)!`;openModal('Prévia de mensagem',`<div class="alert info">Prévia apenas. Para envio automático, conecte a WhatsApp Business Platform.</div><textarea id="waText" style="width:100%;min-height:180px">${esc(text)}</textarea><p class="muted tiny">A seleção de fornecedor e o envio em lote serão conectados ao backend.</p>`,'wa',null,'Copiar mensagem');return}
 if(a==='copySummary'){const p=purchase(id||currentId);if(!p)return;const text=`${p.code} · ${dateBR(p.created)}\n`+p.items.map(i=>`${i.qty} ${product(i.productId).unit} ${product(i.productId).name} · ${statusLabel(i.status)} · ${supplier(i.selectedSupplierId).name} · ${money(itemTotal(i))}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Resumo copiado.')).catch(()=>showText(text));else showText(text);return}
}
function showText(t){openModal('Resumo para copiar',`<textarea style="width:100%;min-height:180px">${esc(t)}</textarea>`,'none',null,'Fechar')}
function normKey(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function cell(row,keys){for(const [k,v] of Object.entries(row||{})){const nk=normKey(k);if(keys.some(key=>nk===key||nk.startsWith(key))&&v!==undefined&&v!==null&&String(v).trim()!=='')return v}return ''}
function splitCats(v){return String(v||'').split(/[|;,]/).map(x=>x.trim()).filter(Boolean)}
function validateImport(){
 const file=$('#excelFile')?.files?.[0];if(!file){toast('Selecione uma planilha primeiro.');return}
 const out=$('#importPreview');if(!window.XLSX){out.innerHTML='<div class="alert warn">Não foi possível carregar o leitor de Excel. Verifique a conexão com a internet e tente novamente.</div>';return}
 const reader=new FileReader();
 reader.onload=ev=>{try{
  const wb=XLSX.read(ev.target.result,{type:'array'});
  const sn=wb.SheetNames.find(n=>normKey(n)==='fornecedores');
  const pn=wb.SheetNames.find(n=>['produtos','insumos'].includes(normKey(n)));
  if(!sn||!pn){out.innerHTML='<div class="alert red">A planilha precisa conter as abas Fornecedores e Produtos.</div>';return}
  const sr=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}),pr=XLSX.utils.sheet_to_json(wb.Sheets[pn],{defval:''});
  const suppliers=sr.map(r=>({name:String(cell(r,['fornecedor','nomefornecedor','nome'])).trim(),categories:splitCats(cell(r,['grupo','grupos','categoria','categorias'])),phone:String(cell(r,['whats','whatsapp','telefone'])).trim(),days:Number(cell(r,['tempodeentrega','tempodeentregadias','prazodeentrega'])||0),city:String(cell(r,['cidade'])).trim(),min:Number(cell(r,['pedidominimo','pedidominimoreais'])||0),fee:Number(cell(r,['frete','taxa','fretetaxa'])||0),active:!['nao','false','inativo'].includes(normKey(cell(r,['ativo'])||'sim')),payment:String(cell(r,['prazodepagamento','condicaodepagamento','pagamento'])||'À vista').trim()})).filter(x=>x.name);
  const products=pr.map(r=>({name:String(cell(r,['produto','insumo','nomeproduto','nome'])).trim(),category:String(cell(r,['grupo','categoria'])).trim(),unit:String(cell(r,['unidadedemedida','unidade','unidadedecompra'])||'UND').trim().toUpperCase(),lastPrice:Number(cell(r,['precounitario','precounitarioreais','ultimopreco'])||0)})).filter(x=>x.name);
  window.pendingImport={suppliers,products};
  out.innerHTML=`<div class="alert good"><b>Prévia: ${esc(file.name)}</b><br>${suppliers.length} fornecedor(es) e ${products.length} produto(s) identificados.<br>Registros sem nome foram ignorados. A importação atualiza cadastros com o mesmo nome e acrescenta os novos.</div><div class="actions">${btn('Confirmar importação','confirmImport','primary')} ${btn('Cancelar','cancelImport')}</div>`;
 }catch(err){out.innerHTML='<div class="alert red">Não foi possível ler o Excel. Confira o arquivo e os nomes das abas.</div>'}};
 reader.readAsArrayBuffer(file);
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;search='';categoryFilter='Todos';render()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)eventAction(el)});
document.addEventListener('change',e=>{
  if(e.target.id==='dashboardMonth'){dashboardMonth=e.target.value||'2026-10';render();return}

 if(e.target.id==='supplierCategory'||e.target.id==='productCategory'){categoryFilter=e.target.value;render()}
 if(e.target.id==='reportPeriod'){reportPeriod=e.target.value;render()}
 if(e.target.id==='reportMonth'){reportMonth=e.target.value;render()}
 if(e.target.id==='buyGroup'){$('#buyProducts').innerHTML=buyProductRows(e.target.value)}
 if(e.target.id==='fPayment'){const w=$('#otherPaymentWrap');if(w)w.style.display=e.target.value==='Outros'?'grid':'none'}
 if(e.target.id==='oSupplier'){const s=supplier(e.target.value);const d=$('#oDays');if(d)d.value=s.days;const pay=$('#oPayment');if(pay&&PAYMENTS.includes(s.payment))pay.value=s.payment}
});
document.addEventListener('input',e=>{
 if(['purchaseSearch','supplierSearch','productSearch'].includes(e.target.id)){search=e.target.value;const id=e.target.id;const pos=e.target.selectionStart;render();const el=$('#'+id);if(el){el.focus();el.setSelectionRange(pos,pos)}}
});
$('#modalForm').addEventListener('submit',e=>{
 e.preventDefault();
 if(modalMode==='supplier'){
  const cats=$$('input[name="fCats"]:checked').map(x=>x.value);if(!cats.length){toast('Selecione pelo menos uma categoria.');return}
  const data={name:$('#fName').value.trim(),phone:$('#fPhone').value.trim(),categories:cats,city:$('#fCity').value.trim(),days:Number($('#fDays').value)||0,min:Number($('#fMin').value)||0,fee:Number($('#fFee').value)||0,payment:$('#fPayment').value,paymentOther:$('#fPaymentOther')?.value||'',active:$('#fActive').checked};
  if(modalData?.id)Object.assign(state.suppliers.find(s=>s.id===modalData.id),data);else state.suppliers.push({id:uid(),...data});
  save();closeModal();page='suppliers';render();toast('Fornecedor salvo.');return;
 }
 if(modalMode==='product'){
  const data={name:$('#pName').value.trim(),category:$('#pCategory').value,unit:$('#pUnit').value.trim().toUpperCase(),lastPrice:Number($('#pPrice').value)||0};
  if(modalData?.id)Object.assign(state.products.find(p=>p.id===modalData.id),data);else state.products.push({id:uid(),...data});
  save();closeModal();page='products';render();toast('Insumo salvo.');return;
 }
 if(modalMode==='bulkQuote'){
  const deadline=$('#bulkDeadline').value||today(),deadlineTime=$('#bulkDeadlineTime').value||'17:00';
  const chosen=$$('[data-bulkproduct]:checked').map(el=>({productId:el.dataset.bulkproduct,qty:Number($(`[data-bulkqty="${el.dataset.bulkproduct}"]`).value)})).filter(x=>x.qty>0);
  const selected=$$('[data-bulksupplier]:checked').map(el=>supplier(el.dataset.bulksupplier)).filter(s=>s&&s.active!==false);
  if(!chosen.length){toast('Marque pelo menos um insumo e informe a quantidade.');return}
  if(!selected.length){toast('Selecione pelo menos um fornecedor destinatário.');return}
  const cats=[...new Set(chosen.map(x=>product(x.productId).category))];
  const eligible=selected.filter(s=>s.categories.some(c=>cats.includes(c)));
  if(!eligible.length){toast('Nenhum fornecedor selecionado atende às categorias dos insumos marcados.');return}
  const p={id:uid(),code:'CB-'+String(Date.now()).slice(-6),created:today(),deadline,deadlineTime,note:$('#bulkNote').value.trim(),expectedDelivery:'',paymentSummary:$('#bulkPayment').value,items:chosen.map(x=>({id:uid(),...x,status:'quoting',offers:[],selectedSupplierId:'',changes:[]})),events:[]};
  event(p,`Solicitação de cotação preparada para ${eligible.length} fornecedor(es). Encerramento ${dateBR(deadline)} às ${deadlineTime}.`);
  state.purchases.unshift(p);currentId=p.id;save();closeModal();
  const messages=eligible.map(s=>{
   const relevant=chosen.filter(x=>s.categories.includes(product(x.productId).category));
   const text=`Olá, ${s.name}! Tudo bem? 🤝\\nAqui é da ${state.company.name}.\\n\\nEstamos realizando uma cotação de compra e gostaríamos de receber sua proposta.\\n\\nCOTAÇÃO ${p.code}\\n${relevant.map(x=>`• ${product(x.productId).name} | Quantidade: ${x.qty} ${product(x.productId).unit} | Valor unitário: R$ ____ | Valor total: R$ ____`).join('\\n')}\\n\\nA cotação será encerrada em ${dateBR(deadline)} às ${deadlineTime}. Após esse horário, não consideraremos novas propostas.\\nCondição de pagamento: ${$('#bulkPayment').value==='Manter condição cadastrada'?(s.payment||'a combinar'):$('#bulkPayment').value}.\\n${p.note?'Observações: '+p.note+'\\n':''}\\nPreencha os preços e confirme disponibilidade neste formulário: [LINK DO FORMULÁRIO DO FORNECEDOR]\\n\\nObrigado(a)!`;
   const phone=String(s.phone||'').replace(/\\D/g,'');
   return {supplier:s,text,url:phone?`https://wa.me/${phone}?text=${encodeURIComponent(text)}`:`https://wa.me/?text=${encodeURIComponent(text)}`};
  });
  const cards=messages.map((m,i)=>`<section class="card" style="margin:10px 0"><div class="cardhead"><div><b>${esc(m.supplier.name)}</b><div class="muted tiny">${esc(m.supplier.categories.join(', '))}</div></div><button type="button" class="btn primary" data-action="openSupplierWA" data-url="${esc(m.url)}">Abrir WhatsApp</button></div><textarea id="supplierMessage${i}" style="width:100%;min-height:180px">${esc(m.text)}</textarea><button type="button" class="btn small" data-action="copySupplierMessage" data-message-id="supplierMessage${i}">Copiar texto</button></section>`).join('');
  openModal('Cotações preparadas',`<div class="alert good">Cotação ${esc(p.code)} criada. ${eligible.length} fornecedor(es) selecionado(s), com mensagens individuais prontas para WhatsApp.</div><div class="alert info">Limitação importante: o link do formulário ainda é um marcador. Para um fornecedor externo preencher os preços e gravá-los diretamente no banco de dados, é necessário publicar um formulário acessível pela internet e conectá-lo ao backend. Este HTML local não recebe respostas externas.</div>${cards}`,'none',null,'Fechar');
  page='purchases';render();return;
 }
 if(modalMode==='purchase'){
  const chosen=$$('[data-buyqty]').map(el=>({productId:el.dataset.buyqty,qty:Number(el.value)})).filter(x=>x.qty>0);
  if(!chosen.length){toast('Informe quantidade para pelo menos um insumo.');return}
  const p={id:uid(),code:'CB-'+String(Date.now()).slice(-6),created:today(),deadline:$('#buyDeadline').value||today(),deadlineTime:$('#buyDeadlineTime')?.value||'17:00',note:$('#buyNote').value.trim(),expectedDelivery:'',paymentSummary:'A confirmar por fornecedor',items:chosen.map(x=>({id:uid(),...x,status:'quoting',offers:[],selectedSupplierId:'',changes:[]})),events:[]};event(p,'Cotação criada.');state.purchases.unshift(p);currentId=p.id;save();closeModal();page='detail';render();toast('Cotação criada.');return;
 }
 if(modalMode==='offer'){
  const {p,i}=findItem(modalData.itemId);if(!i)return;const sid=$('#oSupplier').value,price=Number($('#oPrice').value),days=Number($('#oDays').value)||0,payment=$('#oPayment').value;if(!sid||price<=0){toast('Selecione fornecedor e preço válido.');return}
  const existing=i.offers.find(o=>o.supplierId===sid);if(existing)Object.assign(existing,{price,days,payment});else i.offers.push({supplierId:sid,price,days,payment});i.status='selection';if(!i.selectedSupplierId)i.selectedSupplierId=sid;product(i.productId).lastPrice=price;event(p,`Proposta recebida de ${supplier(sid).name} para ${product(i.productId).name}: ${money(price)} por ${product(i.productId).unit}.`);save();closeModal();render();toast('Proposta registrada.');return;
 }
 if(modalMode==='change'){
  const {p,i}=findItem(modalData.itemId);if(!i)return;const field=$('#chField').value,oldValue=field==='Quantidade'?String(i.qty):field==='Preço unitário'?String((i.offers.find(o=>o.supplierId===i.selectedSupplierId)||{}).price??''):field==='Prazo de entrega'?String(p.expectedDelivery||''):String((i.offers.find(o=>o.supplierId===i.selectedSupplierId)||{}).payment||supplier(i.selectedSupplierId).payment);i.changes=i.changes||[];i.changes.push({id:uid(),field,oldValue,newValue:$('#chValue').value.trim(),note:$('#chNote').value.trim(),status:'pending',date:today()});event(p,`Alteração informada pelo fornecedor para ${product(i.productId).name}: ${field}. Aguarda aprovação.`);save();closeModal();render();toast('Alerta de alteração registrado.');return;
 }
 if(modalMode==='wa'){const txt=$('#waText').value;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Mensagem copiada.')).catch(()=>showText(txt));else showText(txt);closeModal();return}
});

if(location.hash.startsWith('#cotar='))formMode();else render();
